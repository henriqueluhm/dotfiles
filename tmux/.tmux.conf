# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -sg escape-time 10

set-option -g repeat-time 250
set-option -g focus-events on

# Key bindings
set-window-option -g mode-keys vi
unbind p
bind p paste-buffer

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

## Use vi keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

## Window split keys
bind-key v split-window -h
bind-key h split-window -v

# Ctrl Tab and Ctrl Shift tab to switch windows (workaround with kitty.conf)
bind-key -n C-M-e next-window
bind-key -n C-M-q previous-window

## Config reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Mouse Mode
set -g mouse on

# Styling
set -g status-bg black
set -g status-fg white
set -g status-right '%d/%m %H:%M 

# Unbind resizing with alt
unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down

# tmux-open plugin
set -g @open 'x'
set -g @open-editor 'C-x'

# tmux-continuum plugin
set -g @continuum-restore 'on'
