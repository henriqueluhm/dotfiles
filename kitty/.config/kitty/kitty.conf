background #080808
background_opacity 0.75

draw_minimal_borders yes
window_padding_width 2
window_border_width 0
hide_window_decorations yes
titlebar-only yes

active_border_color none

tab_bar_edge top
tab_bar_background none
tab_bar_style powerline
tab_powerline_style slanted

tab_title_template "{fmt.fg.c2c2c2}{tab.active_wd}"

# Tabs (Grayscale)
active_tab_foreground #d0d0d0
active_tab_background #3a3a3a
active_tab_font_style bold-italic

inactive_tab_background #262626
inactive_tab_foreground #a0a0a0
inactive_tab_font_style normal

# Font
font_size 14.0

# Theme
include ./grayscale.conf


# BEGIN_KITTY_FONTS
font_family      family=Hack postscript_name=Hack-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto

# Nerd Fonts v3.3.0
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
# END_KITTY_FONTS
