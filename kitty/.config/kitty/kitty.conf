background #080808
background_opacity 0.75

draw_minimal_borders yes
window_padding_width 2
window_border_width 0
hide_window_decorations yes
titlebar-only yes

active_border_color none

# Tabs (Grayscale)
active_tab_foreground #d0d0d0
active_tab_background #3a3a3a
active_tab_font_style bold-italic

inactive_tab_background #262626
inactive_tab_foreground #a0a0a0
inactive_tab_font_style normal

tab_bar_edge top
tab_bar_background none
tab_bar_style powerline
tab_powerline_style slanted

tab_title_template "{fmt.fg.c2c2c2}{tab.active_wd}"

# Theme
include ./grayscale.conf

# Font
font_size 12.0
font_family      family=Hack postscript_name=Hack-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto

# For kitty scrollback with nvim
allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim

# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
